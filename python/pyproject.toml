[project]
name = "unity-mcp-server"
version = "0.1.0"
description = "Phase 1 Unity MCP server: stdio MCP transport + TCP bridge to the Unity Editor"
requires-python = ">=3.10"
dependencies = [
    "mcp==1.28.1",
]

[project.scripts]
unity-mcp-server = "unity_mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["unity_mcp_server*"]
